[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so React Router routes (e.g. /admin, /propiedades/...) work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Server-side <head> so WhatsApp/Facebook previews show each property's cover
# photo, title and price (crawlers don't run the SPA's JavaScript).
[[edge_functions]]
  function = "og-preview"
  path = "/*"
  excludedPath = ["/admin", "/admin/*", "/assets/*"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
